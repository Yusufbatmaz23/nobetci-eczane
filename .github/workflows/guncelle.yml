name: Günlük Nöbetçi Eczane Güncelleyici

on:
  schedule:
    # Türkiye saatiyle 09:05 ve 19:05
    - cron: '5 6,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Eczaneleri Çek ve Temizle
        run: |
          node -e '
          const fs = require("fs");

          async function calistir() {
            const API_KEY = "TgAkfbuuIcFzFcvHVQJ5nOvvVQK31wNaXrFnJKgfWvp1Voo5tA2qNk2wep9b";
            const url = `https://www.nosyapi.com/apiv2/service/pharmacies-on-duty?city=istanbul&apiKey=${API_KEY}`;
            
            try {
              const res = await fetch(url);
              const json = await res.json();
              console.log("API Durumu:", json.status, "Kayıt Sayısı:", json.data ? json.data.length : 0);

              const gorulenler = new Set();
              const temizListe = [];

              if (json.status === "success" && Array.isArray(json.data)) {
                for (const ecz of json.data) {
                  const ad = (ecz.pharmacyName || ecz.name || "").trim().toLowerCase();
                  const ilce = (ecz.district || "").trim().toLowerCase();
                  const anahtar = `${ad}-${ilce}`;

                  if (!gorulenler.has(anahtar) && ecz.latitude && ecz.longitude) {
                    gorulenler.add(anahtar);
                    temizListe.push({
                      ad: ecz.pharmacyName || ecz.name,
                      ilce: ecz.district,
                      adres: ecz.address,
                      tel: ecz.phone,
                      lat: parseFloat(ecz.latitude),
                      lon: parseFloat(ecz.longitude)
                    });
                  }
                }
              }

              // Dosya her halükarda diske yazılır (hata vermemesi için)
              fs.writeFileSync("nobetci.json", JSON.stringify(temizListe, null, 2), "utf8");
              console.log(`Dosya hazırlandı: ${temizListe.length} adet kayıt nobetci.json dosyasına yazıldı.`);

            } catch (err) {
              console.error("İstek Hatası:", err);
              // Hata anında bile dosya oluştur
              if (!fs.existsSync("nobetci.json")) {
                fs.writeFileSync("nobetci.json", "[]", "utf8");
              }
            }
          }

          calistir();
          '

      - name: Değişiklikleri Depoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f nobetci.json ]; then
            git add nobetci.json
            git commit -m "Otomatik nöbetçi listesi güncellendi" || echo "Değişiklik yok, devam ediliyor"
            git push origin HEAD:main || echo "Push edilecek yeni veri yok"
          else
            echo "nobetci.json dosyası bulunamadı, işlem atlandı."
          fi
