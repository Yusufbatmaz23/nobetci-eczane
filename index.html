<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Yakınımdaki Eczaneler</title>
  <meta name="theme-color" content="#0b132b">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b132b; color: #f8fafc; padding: 14px; max-width: 500px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 20px; color: #ef4444; font-weight: 800; }
    header p { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    .mode-switch { display: flex; gap: 8px; margin-bottom: 12px; background: #1c2541; padding: 4px; border-radius: 10px; }
    .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; background: transparent; color: #94a3b8; transition: 0.2s; }
    .mode-btn.active { background: #ef4444; color: #ffffff; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4); }

    #map { height: 260px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #3a506b; z-index: 1; }
    
    .btn-find { 
      background-color: #ef4444; color: white; border: none; padding: 14px; 
      border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; 
      font-size: 15px; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4); 
    }
    .btn-find:disabled { background-color: #64748b; cursor: not-allowed; }
    
    #durum { text-align: center; margin: 10px 0; font-size: 13px; color: #cbd5e1; }
    
    .pharmacy-card { 
      background-color: #1c2541; border-radius: 12px; padding: 14px; 
      margin-bottom: 10px; border: 1px solid #3a506b; position: relative; 
    }
    .badge { 
      position: absolute; top: 12px; right: 12px; 
      background-color: #10b981; color: white; padding: 3px 8px; 
      border-radius: 6px; font-size: 11px; font-weight: bold; 
    }
    .badge-nobet { background-color: #f59e0b; }
    .pharmacy-name { font-size: 17px; font-weight: bold; margin-bottom: 4px; color: #ffffff; }
    .pharmacy-address { font-size: 12px; color: #cbd5e1; margin-bottom: 6px; line-height: 1.4; }
    .pharmacy-dist { font-size: 17px; font-weight: 800; color: #38bdf8; margin-bottom: 10px; }
    
    .card-actions { display: flex; gap: 8px; }
    .card-actions a { 
      flex: 1; text-align: center; padding: 10px; border-radius: 8px; 
      text-decoration: none; font-size: 13px; font-weight: bold; 
    }
    .btn-call { background-color: #334155; color: white; }
    .btn-nav { background-color: #2563eb; color: white; }
  </style>
</head>
<body>

  <header>
    <h1 id="baslik">🚨 Yakınımdaki Eczaneler</h1>
    <p>İlçe sınırı yok. Gerçek coğrafi mesafeye göre en yakınlar.</p>
  </header>

  <div class="mode-switch">
    <button id="btnGunduz" class="mode-btn" onclick="modDegistir('gunduz')">☀️ Açık Eczaneler (Gündüz)</button>
    <button id="btnNobet" class="mode-btn" onclick="modDegistir('nobet')">🌙 Nöbetçi Eczaneler</button>
  </div>

  <button id="findBtn" class="btn-find" onclick="konumAlVeAra()">📍 En Yakın Eczaneleri Bul</button>
  <p id="durum">Konum butonuna basarak arama yapın</p>

  <div id="map"></div>
  <div id="liste"></div>

  <script>
    let aktifMod = "gunduz";
    let map = null;
    let markersLayer = null;
    let sonKonum = null;

    window.onload = function() {
      otomatikModSec();
      haritayiBaslat();
    };

    function otomatikModSec() {
      const simdi = new Date();
      const gun = simdi.getDay(); // 0 = Pazar
      const saat = simdi.getHours();
      const dakika = simdi.getMinutes();
      const ondalikSaat = saat + (dakika / 60);

      // Pazar günleri tam gün veya 18:30 - 08:30 arası -> Nöbetçi Modu
      if (gun === 0 || ondalikSaat >= 18.5 || ondalikSaat < 8.5) {
        modDegistir('nobet');
      } else {
        modDegistir('gunduz');
      }
    }

    function modDegistir(yeniMod) {
      aktifMod = yeniMod;
      const btnG = document.getElementById("btnGunduz");
      const btnN = document.getElementById("btnNobet");
      const baslik = document.getElementById("baslik");

      if (aktifMod === 'gunduz') {
        btnG.classList.add("active");
        btnN.classList.remove("active");
        baslik.innerText = "☀️ Yakınımdaki Açık Eczaneler";
      } else {
        btnN.classList.add("active");
        btnG.classList.remove("active");
        baslik.innerText = "🌙 Yakınımdaki Nöbetçi Eczaneler";
      }

      if (sonKonum) {
        eczaneleriAra(sonKonum.lat, sonKonum.lon);
      }
    }

    function haritayiBaslat(lat = 41.0988, lon = 28.8965) {
      if (!map) {
        map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      } else {
        map.setView([lat, lon], 14);
      }
    }

    function mesafeKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function konumAlVeAra() {
      const durumEl = document.getElementById("durum");
      const btn = document.getElementById("findBtn");

      durumEl.innerText = "GPS uydusuna bağlanılıyor...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.disabled = false;
          sonKonum = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          eczaneleriAra(sonKonum.lat, sonKonum.lon);
        },
        (err) => {
          btn.disabled = false;
          durumEl.innerText = "Konum izni alınamadı. Tarayıcı izinlerinizi kontrol edin.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function eczaneleriAra(userLat, userLon) {
      const durumEl = document.getElementById("durum");
      durumEl.innerText = "Eczaneler taranıyor...";

      haritayiBaslat(userLat, userLon);
      markersLayer.clearLayers();

      L.circleMarker([userLat, userLon], { radius: 9, color: '#38bdf8', fillColor: '#0284c7', fillOpacity: 1 })
        .bindPopup("<b>Buradasınız</b>").addTo(markersLayer);

      if (aktifMod === 'gunduz') {
        // GÜNDÜZ: OpenStreetMap Overpass (Sınırsız & Ücretsiz)
        try {
          const query = `[out:json];node["amenity"="pharmacy"](around:3500,${userLat},${userLon});out;`;
          const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (data.elements && data.elements.length > 0) {
            const liste = data.elements.map(e => ({
              ad: e.tags.name || "Eczane",
              adres: e.tags["addr:street"] ? `${e.tags["addr:street"]} No:${e.tags["addr:housenumber"] || ''}` : "Bölge Eczanesi",
              tel: e.tags.phone || e.tags["contact:phone"] || "",
              lat: e.lat,
              lon: e.lon,
              mesafe: mesafeKm(userLat, userLon, e.lat, e.lon),
              nobetciMi: false
            })).sort((a, b) => a.mesafe - b.mesafe);

            durumEl.innerText = `Sana en yakın ${liste.length} açık eczane listelendi.`;
            listeyiCiz(liste);
          } else {
            durumEl.innerText = "3.5 km çevrede açık eczane bulunamadı.";
          }
        } catch (err) {
          durumEl.innerText = "Açık eczane verisi çekilirken hata oluştu.";
        }
      } else {
        // NÖBETÇİ: GitHub depomuzdaki yerel nobetci.json dosyası
        try {
          // Tarayıcı önbelleğini kırmak için rastgele parametre eklenir
          const res = await fetch(`nobetci.json?v=${Date.now()}`);
          if (!res.ok) throw new Error("Dosya okunamadı");
          const data = await res.json();

          if (Array.isArray(data) && data.length > 0) {
            const liste = data.map(e => ({
              ad: e.ad,
              adres: `${e.adres} (${e.ilce})`,
              tel: e.tel || "",
              lat: e.lat,
              lon: e.lon,
              mesafe: mesafeKm(userLat, userLon, e.lat, e.lon),
              nobetciMi: true
            })).sort((a, b) => a.mesafe - b.mesafe).slice(0, 25); // En yakın 25 nöbetçi

            durumEl.innerText = `Sana en yakın ${liste.length} nöbetçi eczane listelendi!`;
            listeyiCiz(liste);
          } else {
            durumEl.innerText = "Kayıtlı nöbetçi listesi boş veya güncelleniyor (gündüz saatlerinde nöbetçi listesi kapalı olabilir).";
          }
        } catch (err) {
          durumEl.innerText = "Nöbetçi listesi (nobetci.json) okunurken hata oluştu.";
        }
      }
    }

    function listeyiCiz(liste) {
      const container = document.getElementById("liste");
      container.innerHTML = "";

      liste.forEach((ecz, index) => {
        const mesafeTxt = ecz.mesafe < 1 ? `${Math.round(ecz.mesafe * 1000)} m` : `${ecz.mesafe.toFixed(1)} km`;

        if (!isNaN(ecz.lat) && !isNaN(ecz.lon)) {
          L.marker([ecz.lat, ecz.lon]).addTo(markersLayer)
            .bindPopup(`<b>${ecz.ad}</b><br>${ecz.adres}<br>Mesafe: ${mesafeTxt}`);
        }

        const div = document.createElement("div");
        div.className = "pharmacy-card";
        div.innerHTML = `
          ${index === 0 ? '<span class="badge">EN YAKIN</span>' : (ecz.nobetciMi ? '<span class="badge badge-nobet">NÖBETÇİ</span>' : '')}
          <div class="pharmacy-name">${ecz.ad}</div>
          <div class="pharmacy-address">📍 ${ecz.adres}</div>
          <div class="pharmacy-dist">⚡ ${mesafeTxt}</div>
          <div class="card-actions">
            ${ecz.tel ? `<a href="tel:${ecz.tel}" class="btn-call">📞 Ara</a>` : ''}
            <a href="https://www.google.com/maps/dir/?api=1&destination=${ecz.lat},${ecz.lon}" target="_blank" class="btn-nav">🗺️ Yol Tarifi</a>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
