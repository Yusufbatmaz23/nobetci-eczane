<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Yakınımdaki Eczaneler</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* GÜNDÜZ MODU (KIRMIZI TEMA) */
    body.theme-gunduz {
      background-color: #881337;
      color: #ffffff;
    }
    body.theme-gunduz .mode-switch { background: #4c0519; }
    body.theme-gunduz .mode-btn.active { background: #e11d48; color: #ffffff; }
    body.theme-gunduz .pharmacy-card { background-color: #9f1239; border: 1px solid #be123c; }
    body.theme-gunduz .btn-find { background-color: #f43f5e; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }

    /* NÖBETÇİ MODU (SİMSİYAH GECE TEMASI) */
    body.theme-nobet {
      background-color: #000000;
      color: #f8fafc;
    }
    body.theme-nobet .mode-switch { background: #121212; }
    body.theme-nobet .mode-btn.active { background: #27272a; color: #38bdf8; border: 1px solid #3f3f46; }
    body.theme-nobet .pharmacy-card { background-color: #0a0a0a; border: 1px solid #262626; }
    body.theme-nobet .btn-find { background-color: #2563eb; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }

    body { padding: 14px; max-width: 500px; margin: 0 auto; transition: background-color 0.25s ease; }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 20px; font-weight: 800; }
    header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .mode-switch { display: flex; gap: 8px; margin-bottom: 12px; padding: 4px; border-radius: 10px; }
    .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; background: transparent; color: #d1d5db; transition: 0.2s; }

    #map { height: 260px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.2); z-index: 1; }
    
    .btn-find { 
      color: white; border: none; padding: 14px; 
      border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; 
      font-size: 15px; transition: 0.3s;
    }
    .btn-find:disabled { background-color: #52525b !important; cursor: not-allowed; }
    
    #durum { text-align: center; margin: 10px 0; font-size: 13px; opacity: 0.9; }
    
    .pharmacy-card { 
      border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; 
      transition: background-color 0.25s ease;
    }
    .badge { 
      position: absolute; top: 12px; right: 12px; 
      background-color: #10b981; color: white; padding: 3px 8px; 
      border-radius: 6px; font-size: 11px; font-weight: bold; 
    }
    .badge-nobet { background-color: #f59e0b; }
    .pharmacy-name { font-size: 17px; font-weight: bold; margin-bottom: 4px; color: #ffffff; }
    .pharmacy-address { font-size: 12px; opacity: 0.9; margin-bottom: 6px; line-height: 1.4; }
    .pharmacy-dist { font-size: 17px; font-weight: 800; color: #38bdf8; margin-bottom: 10px; }
    
    .card-actions { display: flex; gap: 8px; }
    .card-actions a { 
      flex: 1; text-align: center; padding: 10px; border-radius: 8px; 
      text-decoration: none; font-size: 13px; font-weight: bold; 
    }
    .btn-call { background-color: #3f3f46; color: white; }
    .btn-nav { background-color: #2563eb; color: white; }
  </style>
</head>
<body class="theme-gunduz">

  <header>
    <h1 id="baslik">☀️ Yakınımdaki Açık Eczaneler</h1>
    <p>İlçe sınırı yok. Güncel resmi kayıtlara göre en yakınlar.</p>
  </header>

  <div class="mode-switch">
    <button id="btnGunduz" class="mode-btn active" onclick="modDegistir('gunduz')">☀️ Açık Eczaneler (Gündüz)</button>
    <button id="btnNobet" class="mode-btn" onclick="modDegistir('nobet')">🌙 Nöbetçi Eczaneler</button>
  </div>

  <button id="findBtn" class="btn-find" onclick="konumAlVeAra()">📍 En Yakın Eczaneleri Bul</button>
  <p id="durum">Konum butonuna basarak arama yapın</p>

  <div id="map"></div>
  <div id="liste"></div>

  <script>
    let aktifMod = "gunduz";
    let map = null;
    let markersLayer = null;
    let sonKonum = null;

    window.onload = function() {
      otomatikModSec();
      haritayiBaslat();
    };

    function otomatikModSec() {
      const simdi = new Date();
      const gun = simdi.getDay(); // 0 = Pazar
      const saat = simdi.getHours();
      const dakika = simdi.getMinutes();
      const ondalikSaat = saat + (dakika / 60);

      // Pazar günleri veya 18:30 - 08:30 arası nöbetçi modu
      if (gun === 0 || ondalikSaat >= 18.5 || ondalikSaat < 8.5) {
        modDegistir('nobet');
      } else {
        modDegistir('gunduz');
      }
    }

    function modDegistir(yeniMod) {
      aktifMod = yeniMod;
      const btnG = document.getElementById("btnGunduz");
      const btnN = document.getElementById("btnNobet");
      const baslik = document.getElementById("baslik");

      if (aktifMod === 'gunduz') {
        document.body.className = "theme-gunduz";
        btnG.classList.add("active");
        btnN.classList.remove("active");
        baslik.innerText = "☀️ Yakınımdaki Açık Eczaneler";
      } else {
        document.body.className = "theme-nobet";
        btnN.classList.add("active");
        btnG.classList.remove("active");
        baslik.innerText = "🌙 Yakınımdaki Nöbetçi Eczaneler";
      }

      if (sonKonum) {
        eczaneleriAra(sonKonum.lat, sonKonum.lon);
      }
    }

    function haritayiBaslat(lat = 41.0988, lon = 28.8965) {
      if (!map) {
        map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      } else {
        map.setView([lat, lon], 14);
      }
    }

    function mesafeKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function konumAlVeAra() {
      const durumEl = document.getElementById("durum");
      const btn = document.getElementById("findBtn");

      durumEl.innerText = "GPS uydusuna bağlanılıyor...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.disabled = false;
          sonKonum = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          eczaneleriAra(sonKonum.lat, sonKonum.lon);
        },
        (err) => {
          btn.disabled = false;
          durumEl.innerText = "Konum izni alınamadı. Tarayıcı izinlerinizi kontrol edin.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // AYNI İSİMDEKİ KAYITLARDAN "GERÇEKTEN YENİ VE DOĞRU" OLANI SEÇEN ALGORİTMA
    function enGuncelOlanıSec(kayitlar) {
      if (kayitlar.length === 1) return kayitlar[0];

      return kayitlar.sort((a, b) => {
        // 1. Kriter: Veri Doluluğu Skoru (Cadde, kapı no, telefon var mı?)
        const puanA = (a.tags["addr:street"] ? 4 : 0) + 
                      (a.tags["addr:housenumber"] ? 2 : 0) + 
                      (a.tags.phone || a.tags["contact:phone"] ? 2 : 0);
                      
        const puanB = (b.tags["addr:street"] ? 4 : 0) + 
                      (b.tags["addr:housenumber"] ? 2 : 0) + 
                      (b.tags.phone || b.tags["contact:phone"] ? 2 : 0);

        if (puanA !== puanB) {
          return puanB - puanA; // Adres detayı zengin olan kazanır
        }

        // 2. Kriter: OpenStreetMap Güncellenme Tarihi (Timestamp)
        const tarihA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
        const tarihB = b.timestamp ? new Date(b.timestamp).getTime() : 0;

        if (tarihA !== tarihB) {
          return tarihB - tarihA; // Haritada daha yeni güncellenen/eklenen kazanır
        }

        // 3. Kriter: Düzenleme versiyonu
        return (b.version || 0) - (a.version || 0);
      })[0];
    }

    async function eczaneleriAra(userLat, userLon) {
      const durumEl = document.getElementById("durum");
      durumEl.innerText = "Eczaneler taranıyor...";

      haritayiBaslat(userLat, userLon);
      markersLayer.clearLayers();

      L.circleMarker([userLat, userLon], { radius: 9, color: '#38bdf8', fillColor: '#0284c7', fillOpacity: 1 })
        .bindPopup("<b>Buradasınız</b>").addTo(markersLayer);

      if (aktifMod === 'gunduz') {
        // GÜNDÜZ: "out meta;" ile tarih ve sürüm bilgisiyle beraber çekilir
        try {
          const query = `[out:json];node["amenity"="pharmacy"](around:3500,${userLat},${userLon});out meta;`;
          const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (data.elements && data.elements.length > 0) {
            // Önce aynı isimdeki kayıtları bir araya toplayıp grupluyoruz
            const gruplar = {};

            data.elements.forEach(el => {
              const hamAd = el.tags.name || "Eczane";
              const safAd = hamAd.toLowerCase().replace(/[^a-z0-9ğüşıöç]/gi, '');
              if (!gruplar[safAd]) gruplar[safAd] = [];
              gruplar[safAd].push(el);
            });

            // Her grup için mesafeye bakmaksızın en güncel/detaylı olanı seçiyoruz
            const filtrelenmis = [];
            Object.values(gruplar).forEach(grup => {
              const secilen = enGuncelOlanıSec(grup);
              filtrelenmis.push({
                ad: secilen.tags.name || "Eczane",
                adres: secilen.tags["addr:street"] ? `${secilen.tags["addr:street"]} No:${secilen.tags["addr:housenumber"] || ''}` : "Bölge Eczanesi",
                tel: secilen.tags.phone || secilen.tags["contact:phone"] || "",
                lat: secilen.lat,
                lon: secilen.lon,
                mesafe: mesafeKm(userLat, userLon, secilen.lat, secilen.lon),
                nobetciMi: false
              });
            });

            // Seçilen gerçek eczaneleri kullanıcıya olan mesafesine göre diziyoruz
            filtrelenmis.sort((a, b) => a.mesafe - b.mesafe);

            durumEl.innerText = `Sana en yakın ${filtrelenmis.length} açık eczane listelendi.`;
            listeyiCiz(filtrelenmis);
          } else {
            durumEl.innerText = "3.5 km çevrede açık eczane bulunamadı.";
          }
        } catch (err) {
          durumEl.innerText = "Açık eczane verisi çekilirken hata oluştu.";
        }
      } else {
        // NÖBETÇİ: Depodaki resmi nobetci.json
        try {
          const res = await fetch(`nobetci.json?v=${Date.now()}`);
          if (!res.ok) throw new Error("Dosya okunamadı");
          const data = await res.json();

          if (Array.isArray(data) && data.length > 0) {
            const liste = data.map(e => ({
              ad: e.ad,
              adres: `${e.adres} (${e.ilce})`,
              tel: e.tel || "",
              lat: e.lat,
              lon: e.lon,
              mesafe: mesafeKm(userLat, userLon, e.lat, e.lon),
              nobetciMi: true
            })).sort((a, b) => a.mesafe - b.mesafe);

            durumEl.innerText = `Sana en yakın ${liste.slice(0, 25).length} nöbetçi eczane listelendi!`;
            listeyiCiz(liste.slice(0, 25));
          } else {
            durumEl.innerText = "Kayıtlı nöbetçi listesi güncelleniyor.";
          }
        } catch (err) {
          durumEl.innerText = "Nöbetçi listesi okunurken hata oluştu.";
        }
      }
    }

    function listeyiCiz(liste) {
      const container = document.getElementById("liste");
      container.innerHTML = "";

      liste.forEach((ecz, index) => {
        const mesafeTxt = ecz.mesafe < 1 ? `${Math.round(ecz.mesafe * 1000)} m` : `${ecz.mesafe.toFixed(1)} km`;

        if (!isNaN(ecz.lat) && !isNaN(ecz.lon)) {
          L.marker([ecz.lat, ecz.lon]).addTo(markersLayer)
            .bindPopup(`<b>${ecz.ad}</b><br>${ecz.adres}<br>Mesafe: ${mesafeTxt}`);
        }

        const div = document.createElement("div");
        div.className = "pharmacy-card";
        div.innerHTML = `
          ${index === 0 ? '<span class="badge">EN YAKIN</span>' : (ecz.nobetciMi ? '<span class="badge badge-nobet">NÖBETÇİ</span>' : '')}
          <div class="pharmacy-name">${ecz.ad}</div>
          <div class="pharmacy-address">📍 ${ecz.adres}</div>
          <div class="pharmacy-dist">⚡ ${mesafeTxt}</div>
          <div class="card-actions">
            ${ecz.tel ? `<a href="tel:${ecz.tel}" class="btn-call">📞 Ara</a>` : ''}
            <a href="https://www.google.com/maps/dir/?api=1&destination=${ecz.lat},${ecz.lon}" target="_blank" class="btn-nav">🗺️ Yol Tarifi</a>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
